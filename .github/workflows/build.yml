name: Build APK and Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into assets
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Publish to apk branch
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/GlobalMarket-v${VER}.apk"
          cp web/index.html out/index.html
          touch out/.nojekyll
          cat > out/README.md <<MD
          # 全球行情 v${VER}

          - 手機下載 APK：https://github.com/${GITHUB_REPOSITORY}/raw/apk/GlobalMarket-v${VER}.apk
          - 網頁版：https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/

          *作者：ArchieKUO*
          MD
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Build v${VER} (#${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
