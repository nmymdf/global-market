plugins { id 'com.android.application' }
def ver = rootProject.file('../VERSION').text.trim()
android {
    namespace 'com.archiekuo.globalmarket'
    compileSdk 34
    defaultConfig {
        applicationId 'com.archiekuo.globalmarket'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName ver
    }
    signingConfigs {
        release {
            storeFile rootProject.file('keystore.jks')
            storePassword 'globalmarket'
            keyAlias 'gm'
            keyPassword 'globalmarket'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // 把「自選 1」的台股清單送到手錶（Wear OS Data Layer）
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
