plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def ver = rootProject.file('../VERSION').text.trim()
android {
    namespace 'com.archiekuo.globalmarket.wear'
    compileSdk 34
    defaultConfig {
        // 與手機版相同的套件名稱與簽名，手機和手錶才能互傳資料（Wear OS Data Layer）
        applicationId 'com.archiekuo.globalmarket'
        minSdk 30
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName ver
    }
    signingConfigs {
        release {
            storeFile rootProject.file('keystore.jks')
            storePassword 'globalmarket'
            keyAlias 'gm'
            keyPassword 'globalmarket'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
