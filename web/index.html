<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>全球行情</title>
<style>
:root{--bg:#060a12;--card:#0e1522;--card2:#121b2b;--line:#1e2939;--line2:#182131;--tx:#eef2f6;--tx2:#b6c0cc;--mu:#8792a2;--gold:#D4AF37;--gold2:#f0d68a;--up:#ff4d63;--dn:#1fcf8f;--flat:#9aa4b2;--pu:#e8384f;--pd:#13a874;--pf:#3a4250}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
.n{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--flat)}
.gold{color:var(--gold)}.mu{color:var(--mu);font-size:13px}
.author{color:var(--gold);font-style:italic;font-size:14px;text-align:center;padding:16px 0 8px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.pill{display:inline-block;min-width:84px;text-align:center;padding:4px 6px;border-radius:8px;font-size:16px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{background:var(--pu);color:#fff}.pill.dn{background:var(--pd);color:#fff}.pill.fl{background:var(--pf);color:#dfe5ec}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .45s;overflow:hidden}
#splash.hide{opacity:0;pointer-events:none}
.clk{position:absolute;top:calc(18px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-around;font-size:13px;color:var(--mu)}
.clk b{display:block;color:var(--tx2);font-weight:500;font-size:17px}
.ttl{font-family:"Noto Serif TC","Songti TC",serif;color:var(--gold);font-size:42px;letter-spacing:12px;margin-left:12px;white-space:nowrap;animation:up .9s ease-out both .2s}
.sub{font-size:13px;letter-spacing:6px;color:#9aa5b5;margin-top:6px;white-space:nowrap;animation:up .9s ease-out both .4s}
.cats{font-size:16px;color:#c3cbd6;letter-spacing:3px;white-space:nowrap;animation:up .9s ease-out both .6s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tkw{width:100%;margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;overflow:hidden}
.tk{display:inline-flex;gap:30px;white-space:nowrap;animation:mv 18s linear infinite;font-size:15px}
@keyframes mv{to{transform:translateX(-50%)}}
.ld{width:170px;height:3px;border-radius:2px;background:#141b27;margin:24px auto 0;overflow:hidden}
.ld i{display:block;height:100%;width:0;background:var(--gold);animation:ld 2s linear forwards}
@keyframes ld{to{width:100%}}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:dw 1.6s ease-out forwards .2s}
@keyframes dw{to{stroke-dashoffset:0}}
/* app */
#app{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
header>div:first-child{flex:1;min-width:0}header>div:last-child{flex:none;display:flex}
.brand{font-family:"Noto Serif TC","Songti TC",serif;color:var(--gold);font-size:27px;letter-spacing:4px;white-space:nowrap}
@media (max-width:379px){.brand{font-size:24px;letter-spacing:2px}}
#hstat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mu);margin-right:5px;vertical-align:1px}
.live.on{background:var(--dn);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.hbtn{color:var(--tx2);padding:8px}
.hbtn svg{width:25px;height:25px}
#sbar{display:none;margin-top:12px}
#sbar.on{display:block}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px 14px;font:inherit;font-size:17px;outline:none}
.inp:focus{border-color:var(--gold)}
.chips{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;padding:6px 13px;border-radius:16px;background:#161f2e;color:var(--tx2);white-space:nowrap}
.chip.open{background:#3a1720;color:var(--up)}
.card{background:var(--card);border:1px solid var(--line);border-top-color:#3a3320;border-radius:16px;padding:16px;margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ch>span:first-child{font-size:18px;white-space:nowrap}
.ch .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:linear-gradient(140deg,#24121a 0%,#0e1522 75%)}
.hero.d{background:linear-gradient(140deg,#0c201a 0%,#0e1522 75%)}
.hp{font-size:44px;font-weight:500;line-height:1.15;margin-top:6px;white-space:nowrap}
.hst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin-top:12px;font-size:16px}
.hst div{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.mini.sent{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 10px}
.mini.sent>div{width:100%}
.mini.sent .t{display:flex;justify-content:space-between;align-items:center;height:24px;line-height:24px;text-align:left}
.mini.sent .t span{display:block;line-height:24px}
.mini.sent .t span+span{font-size:12px}
.mini.sent .gauge{display:block;width:100%;max-width:140px;height:auto;margin:8px auto 2px}
.mini.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.exp{cursor:pointer;background:var(--card);border:1.5px solid var(--gold);border-radius:16px;padding:14px;margin-top:8px;font-size:15px;line-height:1.7}
.exp .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.sc{display:flex;gap:4px;margin:10px 0}
.sc span{flex:1;min-width:0;text-align:center;font-size:12px;line-height:1.5;padding:5px 0;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{display:block;font-weight:500;font-size:13px}
.sc .g{background:#0d2219;color:var(--dn)}.sc .g2{background:#0f1c18;color:#7fd8b4}.sc .y{background:#2a2410;color:var(--gold)}.sc .r2{background:#24161a;color:#ff8b98}.sc .r{background:#2a121a;color:var(--up)}
.hauth{flex:none;text-align:right;color:var(--gold);font-style:italic;font-size:12px;line-height:1.35;white-space:nowrap;margin-left:6px;align-self:flex-end;padding-bottom:3px}
.brow{display:flex;align-items:flex-end;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}
.tile{border-radius:12px;padding:10px 9px;border:1px solid #223047;background:#111a29;min-width:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s,box-shadow .15s}
.tile.u{background:#2a121a;border-color:#4a1d29}.tile.d{background:#0d2219;border-color:#17402f}
.tn{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:15px}
.tn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tn .spk{display:block}
.tv{font-size:20px;font-weight:500;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{display:flex;justify-content:space-between;align-items:center;gap:3px;margin-top:5px;font-size:14px;white-space:nowrap;letter-spacing:-.2px}
.tc .pill{min-width:0;font-size:14px;padding:3px 5px;flex:none}
.tc>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile.drag{transform:scale(1.05);box-shadow:0 8px 24px rgba(0,0,0,.6);border:2px dashed var(--gold);z-index:5;position:relative}
.tiles.sorting .tile:not(.drag){opacity:.8}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.mini{background:var(--card);border:1px solid var(--line);border-top-color:#3a3320;border-radius:16px;padding:14px;cursor:pointer;min-width:0}
.mini .t{font-size:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v{font-size:24px;font-weight:500;margin-top:6px;white-space:nowrap}
.mini .pill{margin-top:6px;min-width:0;font-size:15px}
.row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line2);cursor:pointer;min-height:72px}
.row:last-child{border-bottom:0}
.rn{flex:1;min-width:0}
.nm{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:13px;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp{flex:none;text-align:right}
.pv{font-size:20px;font-weight:500;border-radius:5px;padding:0 3px;white-space:nowrap;display:inline-block}
.rp .pill{margin-top:5px}
.rp .cd{font-size:13px;margin-top:3px;white-space:nowrap}
.spk{flex:none}
@media (max-width:379px){.spk{display:none}}
.fu{animation:fu .9s}.fd{animation:fd .9s}
@keyframes fu{0%{background:rgba(255,77,99,.5)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(31,207,143,.5)}100%{background:transparent}}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.gh{font-size:15px;color:var(--gold);padding:16px 2px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.seg{display:inline-flex;background:#141c2a;border-radius:10px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--tx2);white-space:nowrap}
.seg button.on{background:var(--gold);color:#0d1117;font-weight:500}
.empty{text-align:center;color:var(--mu);padding:40px 10px;line-height:1.9;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,10,18,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;font-size:13px;color:#7d8899;text-align:center;white-space:nowrap}
nav button svg{display:block;margin:0 auto 3px;width:27px;height:27px}
nav button.on{color:var(--gold)}
/* detail */
#det{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .28s ease;padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
#det.on{transform:none}
.dwrap{max-width:760px;margin:0 auto}
.dh{display:flex;align-items:center;gap:8px}
.dh .t{flex:1;min-width:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:44px;font-weight:500;margin-top:12px;white-space:nowrap}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.per{display:flex;gap:6px;flex:1;min-width:230px}
.per button{flex:1;padding:9px 0;border-radius:10px;background:#141c2a;font-size:16px;color:var(--tx2)}
.per button.on{background:var(--gold);color:#0d1117;font-weight:500}
#cvw{position:relative;margin-top:8px;touch-action:pan-y}
#cv{display:block;width:100%;height:300px}
#tip{font-size:14px;color:var(--tx2);min-height:20px;margin-top:10px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;margin-top:8px}
.stats div{display:flex;justify-content:space-between;gap:6px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:16px;color:var(--tx2);white-space:nowrap}
.stats b{font-weight:500;color:var(--tx)}
.star{font-size:28px;color:var(--mu);padding:4px 8px}
.star.on{color:var(--gold)}
body{word-break:keep-all;overflow-wrap:normal}
.gtrow{display:flex;gap:8px;align-items:center;margin-top:12px;position:relative}
.gsel{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0a111d;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:18px;white-space:nowrap;cursor:pointer}
.gsel.on{border-color:var(--gold)}
.gsel span{overflow:hidden;text-overflow:ellipsis}
.gsel i{font-style:normal;color:var(--gold);font-size:13px;flex:none}
.cbar{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;background:#2a1418;border:1px solid #5a2430;flex-wrap:wrap}
.cbar span{flex:1;min-width:160px;font-size:16px}
.note{margin-top:8px;font-size:14px;color:var(--up)}
.gdd{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:#101827;border:1px solid var(--gold);border-radius:12px;max-height:340px;overflow-y:auto;padding:4px}
.gdd div{padding:12px;border-radius:8px;font-size:17px;display:flex;justify-content:space-between;white-space:nowrap;cursor:pointer}
.gdd div.on{background:#24304a;color:var(--gold)}
.gdd div.add{color:var(--gold);border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 8px 8px}
.gtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-bottom:2px}
.gtabs::-webkit-scrollbar{display:none}
.gtab{flex:none;padding:8px 15px;border-radius:18px;background:#161f2e;color:var(--tx2);font-size:15px;white-space:nowrap}
.gtab.on{background:var(--gold);color:#0d1117;font-weight:500}
.gtab.add{flex:none;border:1px dashed var(--gold);background:none;color:var(--gold);padding:8px 13px}
.addf{display:flex;gap:8px;align-items:stretch}
.addf .cell{flex:1}
.addbtn{flex:none;padding:0 18px;border-radius:12px;background:var(--gold);color:#0d1117;font-size:16px;font-weight:500;white-space:nowrap}
.sorts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.sorts::-webkit-scrollbar{display:none}
.sorts button{flex:none;font-size:14px;padding:6px 11px;border-radius:9px;background:#141c2a;color:var(--tx2);white-space:nowrap;border:1px solid transparent}
.sorts button.on{border-color:var(--gold);color:var(--gold)}
.wbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.wbar .cell{flex:1;min-width:150px;min-height:44px}
.wbar input{text-align:left !important}
.tbtn{flex:none;font-size:14px;padding:8px 12px;border-radius:10px;background:#161f2e;color:var(--tx2);white-space:nowrap}
.tbtn.red{background:#2a1418;color:var(--up)}
.tile .twl{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-left:5px;vertical-align:3px}
.tile.sel{outline:2px solid var(--gold);outline-offset:-2px}
.tile .ckm{display:none}
.tiles.edit .tile .ckm{display:inline-flex;flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--mu);align-items:center;justify-content:center;font-size:13px;color:#0d1117;margin-right:4px}
.tiles.edit .tile.sel .ckm{background:var(--gold);border-color:var(--gold)}
.badge{flex:none;font-size:12px;padding:3px 8px;border-radius:7px;background:#3a1720;color:var(--up);white-space:nowrap}
.badge.dl{background:#1a2333;color:var(--mu)}
.ob{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px;font-size:16px}
.ob .h{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);padding:0 8px 4px}
.ob .l{display:flex;justify-content:space-between;padding:6px 8px;border-radius:7px;margin-bottom:3px;white-space:nowrap;position:relative;overflow:hidden}
.ob .l i{position:absolute;top:0;bottom:0;opacity:.18}
.ob .bid i{right:0;background:var(--up)}.ob .ask i{left:0;background:var(--dn)}
.ob .l span{position:relative}
/* converter (Excel-style cells) */
.cv{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:8px;align-items:end;margin-top:6px}
.cell{position:relative;background:#0a111d;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:50px;outline:none;cursor:text;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:17px;white-space:nowrap}
.cell>span:first-child{overflow:hidden;text-overflow:ellipsis}
.cell.act{border-color:var(--gold)}
.cell.err{border-color:var(--up);background:#2a1418}
.cell .arr{display:none;color:var(--gold);font-size:12px}
.cell.act .arr{display:inline}
.cell input{width:100%;background:transparent;border:0;outline:none;color:var(--tx);font:inherit;text-align:right;font-variant-numeric:tabular-nums;padding:0}
.cell.amt{justify-content:flex-end;font-size:24px;font-weight:500}
.lbl{font-size:14px;color:var(--mu);margin:10px 2px 6px}
.swap{width:48px;height:50px;border-radius:12px;background:#1a2333;color:var(--gold);display:flex;align-items:center;justify-content:center}
.swap svg{width:24px;height:24px}
.dd{position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);z-index:15;background:#101827;border:1px solid var(--gold);border-radius:12px;max-height:300px;overflow-y:auto;padding:4px}
.dd div{padding:10px;border-radius:8px;font-size:17px;display:flex;justify-content:space-between;cursor:pointer}
.dd div.hi{background:#24304a}
.dd div span{color:var(--mu);font-size:14px}
.res{margin-top:14px;padding:14px;border-radius:14px;background:#0a111d;text-align:right}
.res .v{font-size:32px;font-weight:500;color:var(--gold2);white-space:nowrap}
.res .ln{font-size:15px;margin-top:6px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xt .row{cursor:default;min-height:60px}
.rk{min-height:56px}
.rk .no{width:24px;font-size:17px;flex:none}
</style>
</head>
<body>

<div id="splash">
  <div class="clk" id="clk"></div>
  <svg width="230" height="230" viewBox="0 0 230 230" aria-hidden="true">
    <defs><radialGradient id="gl" cx="40%" cy="35%"><stop offset="0" stop-color="#18253d"/><stop offset="1" stop-color="#080d18"/></radialGradient></defs>
    <circle cx="115" cy="115" r="104" fill="none" stroke="#D4AF37" stroke-width=".5" opacity=".18"/>
    <circle cx="115" cy="115" r="94" fill="none" stroke="#D4AF37" stroke-width=".6" opacity=".3" stroke-dasharray="2 5"><animateTransform attributeName="transform" type="rotate" from="0 115 115" to="360 115 115" dur="30s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="115" r="82" fill="url(#gl)" stroke="#D4AF37" stroke-width="1"/>

      <ellipse cx="115" cy="115" rx="70" ry="82"><animate attributeName="rx" values="50;0;82;50" dur="6s" repeatCount="indefinite"/></ellipse>
      <line x1="115" y1="33" x2="115" y2="197"/>

    <g fill="#D4AF37">
      <circle cx="150" cy="98" r="3"><animate attributeName="r" values="2;5;2" dur="1.6s" repeatCount="indefinite"/></circle>

      <circle cx="92" cy="84" r="2.5"><animate attributeName="r" values="2;4.5;2" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>

    <path class="draw" d="M28 172 L54 161 L74 167 L100 146 L120 152 L145 127 L166 136 L186 111 L206 99" fill="none" stroke="#f6465d" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <div class="ttl">全球行情</div>
  <div class="sub">GLOBAL MARKETS · LIVE</div>

  try{return await pget(u,j=>j&&Array.isArray(j.msgArray))}catch(e){if(window.Native&&!twWarm){twWarm=true;try{await nget('https://mis.twse.com.tw/stock/index.jsp')}catch(x){}return pget(u,j=>j&&Array.isArray(j.msgArray))}throw e}}

  let p=nn(m.z);if(p==null)p=b.length?b[0][0]:a.length?a[0][0]:q.p;
  q.p=p;q.pv=nn(m.y)||q.pv;q.o=nn(m.o)||q.o;q.h=nn(m.h)||q.h;q.l=nn(m.l)||q.l;if(id!=='^TWII')q.v=parseInt(m.v)||q.v;
  q.t=parseInt(m.tlong)||Date.now();q.tw={b,a,u:nn(m.u),w:nn(m.w),tv:parseInt(m.tv)||0,ts:m.t||''};q.twAt=Date.now();
  if(q.s&&q.s.length&&p!=null)q.s[q.s.length-1]=p;
  if(it.auto&&m.n&&it.n!==m.n){it.n=m.n;const c=CUSTOM.find(x=>x.id===id);if(c){c.n=m.n;LS.set('gm_custom',CUSTOM)}}}

    for(let i=0;i<keys.length;i+=40){const part=keys.slice(i,i+40);let n=0;try{n=eat(await twFetch(part))}catch(e){}

function rTWD(code,prev){if(code==='TWD')return 1;if(code==='BTC'||code==='ETH'){const q=Q[code+'USDT'],u=Q['TWD=X'];if(!q||!u)return null;const a=prev?q.pv:q.p,b=prev?u.pv:u.p;return a&&b?a*b:null}
  const id=code==='USD'?'TWD=X':code+'TWD=X';const q=Q[id];if(!q)return null;return prev?q.pv:q.p}
function conv(a,f,t,prev){const x=rTWD(f,prev),y=rTWD(t,prev);return x&&y?a*x/y:null}
function cdec(code,v){if(code==='BTC'||code==='ETH')return 8;if(code==='KRW'||code==='JPY')return v>=100?0:2;return v!=null&&Math.abs(v)<1?4:2}
function fxRes(){const a=CONV.a,f=CONV.f,t=CONV.t,r=conv(a,f,t),r1=conv(1,f,t),r1p=conv(1,f,t,true),rr=conv(1,t,f),pc=pct(r1,r1p),s=sgn(pc||0);return '<div class="res"><div class="mu" style="font-size:15px">'+fmt(a,a%1?2:0)+' '+CURN[f]+' =</div><div class="v n">'+fmt(r,cdec(t,r))+' <span style="font-size:14px">'+CURN[t]+'</span></div>'
   +'<div class="n ln">1 '+f+' = '+fmt(r1,cdec(t,r1)<4?4:cdec(t,r1))+' '+t+'　<span class="'+s+'">'+(pc==null?'':arrow(pc)+' '+(pc>0?'+':'')+fmt(pc,2)+'%')+'</span></div><div class="n ln">1 '+t+' = '+fmt(rr,cdec(f,rr)<4?4:cdec(f,rr))+' '+f+'</div></div>'}

async function doAdd(){const inp=$('#addinp'),cell=$('#addcell'),msg=$('#addmsg');if(!inp||adding)return;
  const raw=inp.value.trim();if(!raw){inp.focus();return}
  const sp=raw.split(/\s+/);let code=sp[0].toUpperCase();const name=sp.slice(1).join(' ');
  const tries=/^\d{4,6}[A-Z]?$/.test(code)?[code+'.TW',code+'.TWO']:[code];
  if(/^\d/.test(code)&&/\.TWO?$/.test(code))tries.unshift(code);
  const hit=tries.find(t=>BY[t]);const ids=curIds();
  if(hit){if(!ids.includes(hit)){ids.push(hit);saveG()}inp.value='';ADDVAL='';ADDERR='';twNext=0;render(true);setTimeout(()=>{const i=$('#addinp');if(i)i.focus()},0);return}
  adding=true;cell.classList.remove('err');msg.textContent='查詢中…';
  let ok=null,twm=null;
  if(/^\d{4,6}[A-Z]?$/.test(code)){for(const ex of ['tse','otc']){try{const j=await twFetch([ex+'_'+code.toLowerCase()+'.tw']);twm=(j.msgArray||[]).find(m=>m&&m.n&&(m.y||m.z||m.b));if(twm){ok=code+(ex==='otc'?'.TWO':'.TW');break}}catch(x){}}}
  if(!ok){for(const t of tries){try{await yQuote(t);if(Q[t]&&Q[t].p!=null){ok=t;break}}catch(x){}}}
  adding=false;
  if(!ok){ADDERR='找不到「'+code+'」，請確認代號（未儲存）';ADDVAL=raw;cell.classList.add('err');render(true);return}
  ADDERR='';ADDVAL='';
  const c={id:ok,n:name||(twm&&twm.n)||(Q[ok]&&Q[ok].nm)||ok,auto:!name};CUSTOM.push(c);LS.set('gm_custom',CUSTOM);addItem(c);
  if(twm)twApply(twm,ok);if(twm)yQuote(ok).then(()=>{dirty=true}).catch(()=>{});
  if(!ids.includes(ok)){ids.push(ok);saveG()}LS.set('gm_q',Q);twNext=0;
  inp.value='';render(true);setTimeout(()=>{const i=$('#addinp');if(i)i.focus()},0);
}

  $('#dbody').innerHTML='<div class="dh"><button class="hbtn" id="dback" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><div class="t">'+esc(it.n)+' <span class="mu" style="font-size:14px">'+esc(it.code||it.id.replace(/\.TWO?$/,''))+'</span></div><span id="dbadge"></span><button class="star" id="dstar" aria-label="自選">☆</button></div>'
   +'<div id="dpx"></div><div class="ctl"><div class="per" id="dper">'+PER.map(([k,n])=>'<button data-p="'+k+'">'+n+'</button>').join('')+'</div><span class="seg" id="dtype"><button data-t="line">折線</button><button data-t="k">K 線</button></span></div>'
   +'<div id="tip" class="n"></div><div id="cvw"><canvas id="cv"></canvas></div><div id="prng" class="n mu" style="margin-top:6px;font-size:14px"></div><div class="stats n" id="dst"></div><div id="dob"></div>'
   +'<div class="mu" style="margin-top:16px;line-height:1.8;font-size:14px">'+(it.src==='b'?'資料來源：Binance（即時推送）。漲跌對比 24 小時前價格。':twKey(id)?'報價：臺灣證券交易所／證券櫃檯買賣中心即時資訊，盤中約 5 秒更新；走勢圖：Yahoo Finance。漲跌對比昨收。':'資料來源：Yahoo Finance，股市報價多為延遲約 15 分鐘，匯率約每分鐘更新。漲跌對比前一交易日收盤。')+'</div><div class="author">'+AUTH+'</div>';
  $('#det').classList.add('on');$('#det').scrollTop=0;history.pushState({d:1},'');
  $('#dback').onclick=()=>history.back();
  $('#dstar').onclick=()=>{const ids=curIds(),i=ids.indexOf(id);i<0?ids.push(id):ids.splice(i,1);saveG();upStar();dirty=true};
  $('#dper').onclick=e=>{const b=e.target.closest('[data-p]');if(b){detPer=b.dataset.p;upCtl();loadHist()}};
  $('#dtype').onclick=e=>{const b=e.target.closest('[data-t]');if(b){detType=b.dataset.t;LS.set('gm_ctype',detType);upCtl();drawChart()}};
  const cv=$('#cv');
  const mv=ev=>{const r=cv.getBoundingClientRect();const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;if(!hist.length)return;const L=6,R=r.width-70;hover=Math.max(0,Math.min(hist.length-1,Math.round((x-L)/(R-L)*(hist.length-1))));drawChart()};
  cv.addEventListener('mousemove',mv);cv.addEventListener('touchstart',mv,{passive:true});cv.addEventListener('touchmove',mv,{passive:true});
  const out=()=>{hover=null;drawChart()};cv.addEventListener('mouseleave',out);cv.addEventListener('touchend',out);
  upStar();upCtl();liveDetail();loadHist();
}
function closeDetail(){detId=null;$('#det').classList.remove('on');dirty=true}
window.addEventListener('popstate',()=>{if(detId)closeDetail()});
window.onBack=function(){if(EXP&&!detId){EXP=null;render(true);return true}if(gOpen){gOpen=false;render(true);return true}if(ddOpen){closeDD();return true}if(detId){history.back();return true}if($('#sbar').classList.contains('on')){$('#bsearch').click();return true}if(TAB!=='home'){TAB='home';drawNav();render();return true}return false};
function upStar(){const s=$('#dstar');if(!s)return;const on=curIds().includes(detId);s.title=on?'已在「'+GROUPS[GI].n+'」':'加入「'+GROUPS[GI].n+'」';s.textContent=on?'★':'☆';s.className='star'+(on?' on':'')}
function upCtl(){document.querySelectorAll('#dper button').forEach(b=>b.classList.toggle('on',b.dataset.p===detPer));document.querySelectorAll('#dtype button').forEach(b=>b.classList.toggle('on',b.dataset.t===detType))}
let lastDp=null,lastKey='';
function liveDetail(quiet){if(!detId)return;const it=BY[detId],q=Q[detId]||{},c=chg(detId),s=c?sgn(c.d):'fl';let d=dec(it,q.p);
  const key=q.p+'|'+q.t+'|'+(q.tw?q.tw.ts:'');const fl=lastDp!=null&&q.p!=null&&q.p!==lastDp?(q.p>lastDp?' fu':' fd'):'';if(quiet&&key===lastKey)return;lastKey=key;lastDp=q.p;
  const tw=twKey(detId)&&q.tw,live=twLive(detId);if(tw&&it.d==null)d=twDec(q.p);
  $('#dbadge').innerHTML=it.src==='b'?'<span class="badge">即時</span>':live?'<span class="badge">即時 · '+esc(q.tw.ts||hm(q.t))+'</span>':'<span class="badge dl">'+(twKey(detId)?'最後更新 '+hm(q.t||Date.now()):'延遲約 15 分')+'</span>';
  $('#dpx').innerHTML='<div class="big n '+s+'"><span class="pv'+fl+'" style="font-size:inherit">'+fmt(q.p,d)+'</span></div><div style="display:flex;gap:12px;align-items:center;margin-top:6px;flex-wrap:wrap">'+pill(c?c.pc:null)+'<span class="n '+s+'" style="font-size:19px">'+(c?arrow(c.d)+' '+fmt(Math.abs(c.d),d):'')+'</span><span class="mu" style="font-size:14px">'+(mstat(detId)||'')+(q.t?' · '+hm(q.t):'')+'</span></div>';
  const S=it.src==='b'?[['24h 開盤',fmt(q.o,d)],['24h 前價',fmt(q.pv,d)],['24h 最高','<b class="up">'+fmt(q.h,d)+'</b>'],['24h 最低','<b class="dn">'+fmt(q.l,d)+'</b>'],['24h 成交量',compact(q.v)+' '+it.code],['24h 成交額',compact(q.qv)+' USDT']]
   :tw?[['成交量',fmt(q.v,0)+' 張'],['單量',fmt(q.tw.tv,0)+' 張'],['開盤',fmt(q.o,d)],['昨收',fmt(q.pv,d)],['最高','<b class="up">'+fmt(q.h,d)+'</b>'],['最低','<b class="dn">'+fmt(q.l,d)+'</b>'],['漲停','<b class="up">'+fmt(q.tw.u,d)+'</b>'],['跌停','<b class="dn">'+fmt(q.tw.w,d)+'</b>'],['52 週高',fmt(q.h52,d)],['52 週低',fmt(q.l52,d)]].filter(x=>!(detId==='^TWII'&&/量|停/.test(x[0])))
   :[['開盤',fmt(q.o,d)],['前收',fmt(q.pv,d)],['最高','<b class="up">'+fmt(q.h,d)+'</b>'],['最低','<b class="dn">'+fmt(q.l,d)+'</b>'],['52 週高',fmt(q.h52,d)],['52 週低',fmt(q.l52,d)],['成交量',compact(q.v)]];
  $('#dst').innerHTML=S.map(([a,b])=>'<div><span>'+a+'</span><b>'+b+'</b></div>').join('');
  if(tw&&detId!=='^TWII'&&(q.tw.b.length||q.tw.a.length)){const mx=Math.max(1,...q.tw.b.map(x=>x[1]),...q.tw.a.map(x=>x[1]));const cl=v=>sgn(v-(q.pv||v));
    $('#dob').innerHTML='<div style="font-size:18px;margin-top:16px">最佳五檔</div><div class="ob n"><div><div class="h"><span>買價</span><span>張數</span></div>'+q.tw.b.map(x=>'<div class="l bid"><i style="width:'+(x[1]/mx*100)+'%"></i><span class="'+cl(x[0])+'">'+fmt(x[0],d)+'</span><span>'+fmt(x[1],0)+'</span></div>').join('')+'</div><div><div class="h"><span>賣價</span><span>張數</span></div>'+q.tw.a.map(x=>'<div class="l ask"><i style="width:'+(x[1]/mx*100)+'%"></i><span class="'+cl(x[0])+'">'+fmt(x[0],d)+'</span><span>'+fmt(x[1],0)+'</span></div>').join('')+'</div></div>'}
  else $('#dob').innerHTML='';
  if(it.src==='b'&&hist.length&&q.p){const L=hist[hist.length-1];L.c=q.p;L.h=Math.max(L.h,q.p);L.l=Math.min(L.l,q.p);drawChart()}
}
async function loadHist(){const id=detId,per=detPer,it=BY[id];hist=[];hover=null;drawChart('載入中…');
  try{let P=[];
    if(it.src==='b'){const m={d:['5m',288],w:['1h',168],m:['4h',180],y:['1d',365],a:['1w',1000]}[per];const k=await bget('/api/v3/klines?symbol='+id+'&interval='+m[0]+'&limit='+m[1]);P=k.map(x=>({t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}))}
    else{const m={d:['1d','5m'],w:['5d','30m'],m:['1mo','1d'],y:['1y','1d'],a:['max','1mo']}[per];const j=await yget(yurl(id,m[0],m[1]));const r=j.chart.result[0],qq=r.indicators.quote[0];(r.timestamp||[]).forEach((t,i)=>{if(qq.close[i]!=null)P.push({t:t*1000,o:qq.open[i]??qq.close[i],h:qq.high[i]??qq.close[i],l:qq.low[i]??qq.close[i],c:qq.close[i],v:qq.volume?qq.volume[i]:0})})}
    if(detId!==id||detPer!==per)return;hist=P;drawChart(P.length?null:'沒有資料')}
  catch(e){if(detId===id)drawChart('無法取得走勢資料，請稍後再試')}}
function tlabel(t,full){const d=new Date(t),p=n=>String(n).padStart(2,'0');if(detPer==='d')return p(d.getHours())+':'+p(d.getMinutes());if(detPer==='w')return(d.getMonth()+1)+'/'+d.getDate()+(full?' '+p(d.getHours())+':'+p(d.getMinutes()):'');if(detPer==='a')return d.getFullYear()+(full?'/'+(d.getMonth()+1):'');return(full?d.getFullYear()+'/':'')+(d.getMonth()+1)+'/'+d.getDate()}
function drawChart(msg){const cv=$('#cv');if(!cv)return;const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=300;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const it=BY[detId],P=hist;if(msg||!P.length){x.fillStyle='#6b7686';x.font='13px sans-serif';x.textAlign='center';x.fillText(msg||'載入中…',W/2,H/2);$('#tip').textContent='';$('#prng').textContent='';return}
  const q=Q[detId]||{},base=detPer==='d'&&it.src==='y'?q.pv:null,ref=base!=null?base:P[0].o||P[0].c,last=P[P.length-1].c,s=sgn(last-ref),col=COL[s];
  const L=6,R=W-70,T=14,B=H-42,VH=30;let lo=Infinity,hi=-Infinity,vm=0;for(const p of P){lo=Math.min(lo,detType==='k'?p.l:p.c);hi=Math.max(hi,detType==='k'?p.h:p.c);vm=Math.max(vm,p.v||0)}if(base!=null){lo=Math.min(lo,base);hi=Math.max(hi,base)}
  const pad=(hi-lo)*.06||hi*.01||1;lo-=pad;hi+=pad;const n=P.length,X=i=>n===1?(L+R)/2:L+i*(R-L)/(n-1),Y=v=>T+(hi-v)/(hi-lo)*(B-VH-T),d=dec(it,last);
  x.strokeStyle='#18212f';x.lineWidth=1;x.fillStyle='#6b7686';x.font='13px sans-serif';x.textAlign='left';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();x.fillText(fmt(v,d),R+6,y+4)}
  if(vm){for(let i=0;i<n;i++){const p=P[i],h=(p.v||0)/vm*VH;x.fillStyle=p.c>=p.o?'rgba(246,70,93,.35)':'rgba(46,189,133,.35)';const w=Math.max(1,(R-L)/n*.7);x.fillRect(X(i)-w/2,B-h,w,h)}}
  if(base!=null){x.setLineDash([4,4]);x.strokeStyle='#6b7686';x.beginPath();x.moveTo(L,Y(base));x.lineTo(R,Y(base));x.stroke();x.setLineDash([]);x.fillStyle='#6b7686';x.fillText('前收',L+2,Y(base)-4)}
  if(detType==='k'){const w=Math.max(1,Math.min(10,(R-L)/n*.65));for(let i=0;i<n;i++){const p=P[i],c=p.c>=p.o?COL.up:COL.dn;x.strokeStyle=c;x.fillStyle=c;x.beginPath();x.moveTo(X(i),Y(p.h));x.lineTo(X(i),Y(p.l));x.stroke();const y1=Y(Math.max(p.o,p.c)),y2=Y(Math.min(p.o,p.c));x.fillRect(X(i)-w/2,y1,w,Math.max(1,y2-y1))}}
  else{x.beginPath();P.forEach((p,i)=>i?x.lineTo(X(i),Y(p.c)):x.moveTo(X(i),Y(p.c)));const g=x.createLinearGradient(0,T,0,B-VH);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');x.save();x.lineTo(X(n-1),B-VH);x.lineTo(X(0),B-VH);x.closePath();x.fillStyle=g;x.fill();x.restore();
    x.beginPath();P.forEach((p,i)=>i?x.lineTo(X(i),Y(p.c)):x.moveTo(X(i),Y(p.c)));x.strokeStyle=col;x.lineWidth=2;x.lineJoin='round';x.stroke();
    x.fillStyle=col;x.beginPath();x.arc(X(n-1),Y(last),3,0,7);x.fill()}
  x.fillStyle='#6b7686';x.textAlign='center';for(let k=0;k<4;k++){const i=Math.round(k*(n-1)/3);x.fillText(tlabel(P[i].t),Math.min(R-20,Math.max(L+20,X(i))),H-6)}
  const hp=hover!=null?P[hover]:null,show=hp||P[n-1];
  if(hp){x.strokeStyle='#9da7b3';x.lineWidth=.8;x.setLineDash([3,3]);x.beginPath();x.moveTo(X(hover),T);x.lineTo(X(hover),B);x.moveTo(L,Y(hp.c));x.lineTo(R,Y(hp.c));x.stroke();x.setLineDash([]);x.fillStyle='#D4AF37';x.beginPath();x.arc(X(hover),Y(hp.c),4,0,7);x.fill();x.fillStyle='#D4AF37';x.fillRect(R+2,Y(hp.c)-10,68,20);x.fillStyle='#0d1117';x.textAlign='left';x.fillText(fmt(hp.c,d),R+5,Y(hp.c)+4)}
  const pc=pct(show.c,ref);$('#tip').innerHTML=tlabel(show.t,true)+'　開 '+fmt(show.o,d)+'　高 <span class="up">'+fmt(show.h,d)+'</span>　低 <span class="dn">'+fmt(show.l,d)+'</span>　收 <span class="'+sgn(pc||0)+'">'+fmt(show.c,d)+'</span>';
  const rp=pct(last,ref);$('#prng').innerHTML=(detPer==='d'?(it.src==='b'?'近 24 小時':'今日'):'區間')+'漲跌 <span class="'+sgn(rp||0)+'">'+(rp>0?'+':'')+fmt(rp,2)+'%</span>　高 '+fmt(Math.max(...P.map(p=>p.h)),d)+'　低 '+fmt(Math.min(...P.map(p=>p.l)),d);
}
window.addEventListener('resize',()=>{if(detId)drawChart()});

/* ---------- 開場 ---------- */
function clocks(){const z=[['台北','Asia/Taipei'],['東京','Asia/Tokyo'],['倫敦','Europe/London'],['紐約','America/New_York']];$('#clk').innerHTML=z.map(([n,tz])=>{let t='';try{t=new Date().toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit'})}catch(e){}return'<div>'+n+'<b class="n">'+t+'</b></div>'}).join('')}
function ticker(){const ids=['^TWII','^N225','^GSPC','^IXIC','BTCUSDT','ETHUSDT','TWD=X','JPYTWD=X','GC=F','CL=F'];const one=ids.map(id=>{const it=BY[id],q=Q[id]||{},c=chg(id),s=c?sgn(c.d):'fl';return'<span>'+esc(it.n)+' <b class="'+s+'" style="font-weight:500">'+fmt(q.p,dec(it,q.p))+' '+(c?arrow(c.d)+fmt(Math.abs(c.pc),2)+'%':'')+'</b></span>'}).join('');$('#stk').innerHTML=one+one}
function endSplash(){const s=$('#splash');if(s.classList.contains('hide'))return;s.classList.add('hide');setTimeout(()=>s.remove(),500)}
$('#sauth').textContent=AUTH;$('#hauth').innerHTML='作者：ArchieKUO<br>'+VER;$('#aauth').textContent=AUTH;
clocks();ticker();$('#splash').addEventListener('click',endSplash);setTimeout(endSplash,2000);

/* ---------- 啟動 ---------- */
drawNav();render();
bInit();yRefresh(true);fng();
setInterval(()=>yRefresh(false),30000);
setInterval(fng,600000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){yRefresh(true);if(!wsOn&&ws&&ws.readyState>1)bWS(0)}});
</script>
