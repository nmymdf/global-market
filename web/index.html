<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>全球行情</title>
<style>
:root{--bg:#070b14;--card:#0f1624;--card2:#131c2c;--line:#1f2a3a;--line2:#18212f;--tx:#e6edf3;--tx2:#9da7b3;--mu:#6b7686;--gold:#D4AF37;--gold2:#f0d68a;--up:#f6465d;--dn:#2ebd85;--flat:#8a94a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px}
body{overscroll-behavior:none}
.n{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--flat)}
.gold{color:var(--gold)}.mu{color:var(--mu);font-size:11px}
.author{color:var(--gold);font-style:italic;font-size:12px;text-align:center;padding:14px 0 6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .45s;overflow:hidden}
#splash.hide{opacity:0;pointer-events:none}
.clk{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-around;font-size:11px;color:var(--mu)}
.clk b{display:block;color:var(--tx2);font-weight:500;font-size:13px}
.ttl{font-family:"Noto Serif TC","Songti TC",serif;color:var(--gold);font-size:36px;letter-spacing:12px;margin-left:12px;animation:up .9s ease-out both .2s}
.sub{font-size:11px;letter-spacing:6px;color:#8a95a5;margin-top:6px;animation:up .9s ease-out both .4s}
.cats{font-size:13px;color:#b8c0cc;letter-spacing:3px;animation:up .9s ease-out both .6s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tkw{width:100%;margin-top:26px;border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);padding:8px 0;overflow:hidden}
.tk{display:inline-flex;gap:26px;white-space:nowrap;animation:mv 18s linear infinite;font-size:12px}
@keyframes mv{to{transform:translateX(-50%)}}
.ld{width:160px;height:2px;background:#141b27;margin:22px auto 0;overflow:hidden}
.ld i{display:block;height:100%;width:0;background:var(--gold);animation:ld 2s linear forwards}
@keyframes ld{to{width:100%}}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:dw 1.6s ease-out forwards .2s}
@keyframes dw{to{stroke-dashoffset:0}}
/* app */
#app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(78px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:"Noto Serif TC","Songti TC",serif;color:var(--gold);font-size:20px;letter-spacing:4px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mu);margin-right:4px;vertical-align:1px}
.live.on{background:var(--dn);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.hbtn{font-size:20px;color:var(--tx2);padding:6px}
#sbar{display:none;margin-top:10px}
#sbar.on{display:block}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px 12px;font:inherit;outline:none}
.inp:focus{border-color:var(--gold)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:11px;padding:3px 9px;border-radius:12px;background:#1a2333;color:var(--tx2)}
.chip.open{background:#2a1a1e;color:var(--up)}
.card{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ch>span:first-child{font-size:14px}
.hero{background:linear-gradient(135deg,#1c1216 0%,#0f1624 70%)}
.hero.d{background:linear-gradient(135deg,#0f1f1a 0%,#0f1624 70%)}
.hm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:6px}
.hm div{border-radius:7px;padding:8px 9px;font-size:12px;display:flex;justify-content:space-between;cursor:pointer}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.mini{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;min-width:0}
.mini .v{font-size:19px;margin-top:4px}
.row{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:.5px solid var(--line2);cursor:pointer}
.row:last-child{border-bottom:0}
.rn{flex:1;min-width:0}
.nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:11px;color:var(--mu);margin-top:2px;white-space:nowrap}
.rp{text-align:right;min-width:104px}
.pv{font-size:16px;border-radius:4px;padding:0 3px;transition:background .6s}
.pc{font-size:12px;margin-top:2px}
.fu{animation:fu .9s}.fd{animation:fd .9s}
@keyframes fu{0%{background:rgba(246,70,93,.45)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(46,189,133,.45)}100%{background:transparent}}
.ic{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.gh{font-size:12px;color:var(--gold);padding:12px 2px 2px;display:flex;justify-content:space-between}
.seg{display:inline-flex;background:#141c2a;border-radius:9px;padding:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12px;color:var(--tx2)}
.seg button.on{background:var(--gold);color:#0d1117}
.empty{text-align:center;color:var(--mu);padding:40px 10px;line-height:1.8}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(7,11,20,.96);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:7px 0 calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;font-size:11px;color:var(--mu);text-align:center}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav button.on{color:var(--gold)}
/* detail */
#det{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .28s ease;padding:calc(10px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
#det.on{transform:none}
.dwrap{max-width:760px;margin:0 auto}
.dh{display:flex;align-items:center;gap:8px}
.dh .t{flex:1;font-size:17px}
.big{font-size:32px;margin-top:10px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.per{display:flex;gap:6px;flex:1}
.per button{flex:1;padding:7px 0;border-radius:9px;background:#141c2a;font-size:13px;color:var(--tx2)}
.per button.on{background:var(--gold);color:#0d1117}
#cvw{position:relative;margin-top:8px;touch-action:pan-y}
#cv{display:block;width:100%;height:280px}
#tip{font-size:12px;color:var(--tx2);min-height:18px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;margin-top:6px}
.stats div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--line2);font-size:13px;color:var(--tx2)}
.stats b{font-weight:500;color:var(--tx)}
.star{font-size:22px;color:var(--mu);padding:4px}
.star.on{color:var(--gold)}
/* converter (Excel-style cells) */
.cv{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:8px;align-items:center;margin-top:6px}
.cell{position:relative;background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;outline:none;cursor:text;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cell.act{border-color:var(--gold)}
.cell.err{border-color:var(--up);background:#2a1418}
.cell .arr{display:none;color:var(--gold);font-size:11px}
.cell.act .arr{display:inline}
.cell input{width:100%;background:transparent;border:0;outline:none;color:var(--tx);font:inherit;text-align:right;font-variant-numeric:tabular-nums;padding:0}
.cell.amt{justify-content:flex-end;font-size:20px}
.lbl{font-size:11px;color:var(--mu);margin:8px 2px 4px}
.swap{width:44px;height:44px;border-radius:50%;background:#1a2333;color:var(--gold);font-size:20px;display:flex;align-items:center;justify-content:center}
.dd{position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);z-index:15;background:#101827;border:1px solid var(--gold);border-radius:10px;max-height:260px;overflow-y:auto;padding:4px}
.dd div{padding:8px 9px;border-radius:7px;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.dd div.hi{background:#24304a}
.dd div span{color:var(--mu);font-size:12px}
.res{margin-top:12px;padding:12px;border-radius:12px;background:#0b1220;text-align:right}
.res .v{font-size:26px;color:var(--gold2)}
.xt .row{cursor:default}
</style>
</head>
<body>

<div id="splash">
  <div class="clk" id="clk"></div>
  <svg width="230" height="230" viewBox="0 0 230 230" aria-hidden="true">
    <defs><radialGradient id="gl" cx="40%" cy="35%"><stop offset="0" stop-color="#18253d"/><stop offset="1" stop-color="#080d18"/></radialGradient></defs>
    <circle cx="115" cy="115" r="104" fill="none" stroke="#D4AF37" stroke-width=".5" opacity=".18"/>
    <circle cx="115" cy="115" r="94" fill="none" stroke="#D4AF37" stroke-width=".6" opacity=".3" stroke-dasharray="2 5"><animateTransform attributeName="transform" type="rotate" from="0 115 115" to="360 115 115" dur="30s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="115" r="82" fill="url(#gl)" stroke="#D4AF37" stroke-width="1"/>
    <g fill="none" stroke="#D4AF37" stroke-width=".6" opacity=".55">
      <ellipse cx="115" cy="115" rx="82" ry="26"/><ellipse cx="115" cy="80" rx="72" ry="18"/><ellipse cx="115" cy="150" rx="72" ry="18"/>
      <ellipse cx="115" cy="115" rx="20" ry="82"><animate attributeName="rx" values="82;0;82" dur="6s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="115" cy="115" rx="50" ry="82"><animate attributeName="rx" values="0;82;0" dur="6s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="115" cy="115" rx="70" ry="82"><animate attributeName="rx" values="50;0;82;50" dur="6s" repeatCount="indefinite"/></ellipse>
      <line x1="115" y1="33" x2="115" y2="197"/>
    </g>
    <g fill="#D4AF37">
      <circle cx="150" cy="98" r="3"><animate attributeName="r" values="2;5;2" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="163" cy="92" r="2.5"><animate attributeName="r" values="2;4.5;2" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="92" cy="84" r="2.5"><animate attributeName="r" values="2;4.5;2" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="97" r="2.5"><animate attributeName="r" values="2;4.5;2" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>
    <path class="draw" d="M28 172 L54 161 L74 167 L100 146 L120 152 L145 127 L166 136 L186 111 L206 99" fill="none" stroke="#f6465d" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <div class="ttl">全球行情</div>
  <div class="sub">GLOBAL MARKETS · LIVE</div>
  <div style="width:130px;height:.5px;background:#D4AF37;opacity:.6;margin:14px auto"></div>
  <div class="cats">指數 ・ 匯率 ・ 虛擬貨幣 ・ 商品</div>
  <div class="tkw"><div class="tk n" id="stk"></div></div>
  <div class="ld"><i></i></div>
  <div class="author" id="sauth"></div>
</div>

<div id="app">
  <header>
    <div><div class="brand">全球行情</div><div class="mu" id="hstat"><span class="live" id="dot"></span>連線中…</div></div>
    <div><button class="hbtn" id="bsearch" aria-label="搜尋"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><button class="hbtn" id="brefresh" aria-label="重新整理"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>
  </header>
  <div id="sbar"><input class="inp" id="sinp" placeholder="輸入名稱或代號，例如 台積電、BTC、日圓" autocomplete="off"></div>
  <main id="view"></main>
  <div class="author" id="aauth"></div>
</div>

<nav id="nav"></nav>

<div id="det"><div class="dwrap" id="dbody"></div></div>

<script>
'use strict';
const VER='v1.0';
const AUTH='作者：ArchieKUO　'+VER;
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- 標的清單 ---------- */
const RAW=[
['^TWII','台灣加權','idx','亞洲'],['^N225','日經 225'],['^KS11','韓國 KOSPI'],['^HSI','香港恆生'],['000001.SS','上證指數'],['399001.SZ','深證成指'],['^STI','新加坡 STI'],
['^DJI','道瓊工業',0,'美洲'],['^GSPC','S&P 500'],['^IXIC','那斯達克'],['^SOX','費城半導體'],
['^GDAXI','德國 DAX',0,'歐洲'],['^FTSE','英國富時 100'],['^FCHI','法國 CAC 40'],
['TWD=X','美元 / 台幣','fx','兌台幣',3,'USD'],['JPYTWD=X','日圓 / 台幣',0,0,4,'JPY'],['EURTWD=X','歐元 / 台幣',0,0,3,'EUR'],['CNYTWD=X','人民幣 / 台幣',0,0,4,'CNY'],['GBPTWD=X','英鎊 / 台幣',0,0,3,'GBP'],['HKDTWD=X','港幣 / 台幣',0,0,4,'HKD'],['KRWTWD=X','韓元 / 台幣',0,0,5,'KRW'],['AUDTWD=X','澳幣 / 台幣',0,0,3,'AUD'],['SGDTWD=X','新幣 / 台幣',0,0,3,'SGD'],['THBTWD=X','泰銖 / 台幣',0,0,4,'THB'],
['EURUSD=X','歐元 / 美元',0,'主要貨幣',4],['JPY=X','美元 / 日圓',0,0,3],['DX-Y.NYB','美元指數 DXY',0,0,3],
['GC=F','黃金','more','大宗商品',2],['SI=F','白銀',0,0,3],['CL=F','WTI 原油',0,0,2],['BZ=F','布蘭特原油',0,0,2],['HG=F','銅',0,0,4],['NG=F','天然氣',0,0,3],
['^IRX','美國 13 週國庫券',0,'美國公債殖利率 %',3],['^FVX','美國 5 年期',0,0,3],['^TNX','美國 10 年期',0,0,3],['^TYX','美國 30 年期',0,0,3],
['^VIX','VIX 恐慌指數',0,'市場情緒',2],
['0050.TW','元大台灣50',0,'熱門 ETF／個股',2],['0056.TW','元大高股息',0,0,2],['2330.TW','台積電',0,0,1],['SPY','SPDR S&P 500 ETF',0,0,2],['QQQ','Invesco QQQ',0,0,2],['NVDA','輝達',0,0,2],['AAPL','蘋果',0,0,2]
];
const ITEMS=[];{let c,g,d;for(const r of RAW){c=r[2]||c;if(r[3]){g=r[3];d=undefined}ITEMS.push({id:r[0],n:r[1],c,g,d:r[4]!=null?r[4]:(c==='idx'?2:d),cur:r[5],src:'y'})}}
const CRY=[['BTC','比特幣','#f7931a'],['ETH','以太幣','#8c9eff'],['BNB','幣安幣','#f3ba2f'],['SOL','Solana','#c58cff'],['XRP','瑞波幣','#9aa7b8'],['DOGE','狗狗幣','#c2a633'],['ADA','Cardano','#5b8def'],['TRX','波場','#ff4d4f'],['AVAX','Avalanche','#e84142'],['LINK','Chainlink','#4a7dff'],['TON','Toncoin','#3aa0ff'],['DOT','Polkadot','#e6007a'],['LTC','萊特幣','#a6a9aa'],['BCH','比特幣現金','#8dc351'],['SHIB','柴犬幣','#f0a33a'],['SUI','Sui','#4da2ff'],['NEAR','NEAR','#7ad3b8'],['APT','Aptos','#9ad0c2'],['UNI','Uniswap','#ff4fa3'],['PEPE','佩佩幣','#4caf50']];
for(const [k,n,col] of CRY)ITEMS.push({id:k+'USDT',n,code:k,col,c:'cry',g:'市值前 20（美元報價）',src:'b'});
const BY={};ITEMS.forEach(i=>BY[i.id]=i);
let CUSTOM=LS.get('gm_custom',[]);
function addItem(c){if(BY[c.id])return;const it={id:c.id,n:c.n,c:'my',g:'我新增的',src:'y',d:2};ITEMS.push(it);BY[c.id]=it}
CUSTOM.forEach(addItem);
const CUR=[['TWD','新台幣'],['USD','美元'],['JPY','日圓'],['EUR','歐元'],['CNY','人民幣'],['GBP','英鎊'],['HKD','港幣'],['KRW','韓元'],['AUD','澳幣'],['SGD','新加坡幣'],['THB','泰銖'],['BTC','比特幣'],['ETH','以太幣']];
const CURN={};CUR.forEach(c=>CURN[c[0]]=c[1]);

/* ---------- 狀態 ---------- */
let Q=LS.get('gm_q',{});           // id -> {p,pv,o,h,l,v,s:[],ps,pe,t,h52,l52,qv}
let WATCH=LS.get('gm_watch',['^TWII','^IXIC','TWD=X','BTCUSDT','GC=F']);
let TAB='home',FXREV=LS.get('gm_fxrev',false),RANK='up',EDIT=false,SEL=new Set();
let CONV=LS.get('gm_conv',{a:1000,f:'USD',t:'TWD'});
let LAST={},wsOn=false,lastY=0,dirty=true,detId=null,detPer='d',detType='line',hist=[],hover=null;

/* ---------- 工具 ---------- */
function autoDec(v){v=Math.abs(v);return v>=1000?2:v>=10?2:v>=1?4:v>=.01?5:8}
function dec(it,v){return it&&it.d!=null?it.d:autoDec(v)}
function fmt(v,d){if(v==null||!isFinite(v))return'—';return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function sgn(x){return x>0?'up':x<0?'dn':'fl'}
function arrow(x){return x>0?'▲':x<0?'▼':'－'}
function pct(p,pv){return p!=null&&pv?((p-pv)/pv*100):null}
function compact(v){if(v==null||!isFinite(v)||v===0)return'—';const a=Math.abs(v);if(a>=1e12)return fmt(v/1e12,2)+' 兆';if(a>=1e8)return fmt(v/1e8,2)+' 億';if(a>=1e4)return fmt(v/1e4,1)+' 萬';return fmt(v,0)}
function hm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function chg(id){const q=Q[id];if(!q||q.p==null||!q.pv)return null;return{d:q.p-q.pv,pc:(q.p-q.pv)/q.pv*100}}

/* ---------- 網路 ---------- */
const NCB={};let nid=0;
window.__nativeCb=(id,body)=>{const f=NCB[id];delete NCB[id];if(f)f(body)};
function nget(u){return new Promise((res,rej)=>{const id='r'+(++nid);NCB[id]=b=>{if(b==null)return rej(new Error('net'));try{res(JSON.parse(b))}catch(e){rej(e)}};try{window.Native.get(id,u)}catch(e){delete NCB[id];rej(e)}setTimeout(()=>{if(NCB[id]){delete NCB[id];rej(new Error('timeout'))}},20000)})}
async function jget(u){if(window.Native)return nget(u);const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
const PROX=[u=>u,u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
let px=LS.get('gm_px',0);
async function yget(u){if(window.Native)return nget(u);for(let k=0;k<PROX.length;k++){const i=(px+k)%PROX.length;try{const r=await fetch(PROX[i](u),{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.chart){if(px!==i){px=i;LS.set('gm_px',i)}return j}}}catch(e){}}throw new Error('yahoo')}
const YH=['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com'];let yh=0;
function yurl(sym,range,iv){return YH[(yh++)%2]+'/v8/finance/chart/'+encodeURIComponent(sym)+'?range='+range+'&interval='+iv+'&includePrePost=false'}

/* ---------- Yahoo 行情 ---------- */

let ws,wsTry=0;
function bWS(alt){
  const hosts=['wss://stream.binance.com:9443','wss://data-stream.binance.vision'];
  const url=hosts[alt%2]+'/stream?streams='+BSYM.map(s=>s.toLowerCase()+'@ticker').join('/');
  try{ws=new WebSocket(url)}catch(e){return setTimeout(()=>bWS(alt+1),3000)}
  ws.onopen=()=>{wsOn=true;wsTry=0;dirty=true};
  ws.onmessage=e=>{try{const d=JSON.parse(e.data).data;if(d&&d.s)bTick(d)}catch(x){}};
  ws.onclose=()=>{wsOn=false;dirty=true;wsTry++;setTimeout(()=>bWS(alt+1),Math.min(15000,1000*wsTry))};

}

  const id=code==='USD'?'TWD=X':code+'TWD=X';const q=Q[id];if(!q)return null;return prev?q.pv:q.p}
function conv(a,f,t,prev){const x=rTWD(f,prev),y=rTWD(t,prev);return x&&y?a*x/y:null}
function cdec(code,v){if(code==='BTC'||code==='ETH')return 8;if(code==='KRW'||code==='JPY')return v>=100?0:2;return v!=null&&Math.abs(v)<1?4:2}

  const pad=(hi-lo)*.06||hi*.01||1;lo-=pad;hi+=pad;const n=P.length,X=i=>n===1?(L+R)/2:L+i*(R-L)/(n-1),Y=v=>T+(hi-v)/(hi-lo)*(B-VH-T),d=dec(it,last);
